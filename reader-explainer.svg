<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="230" rx="12" fill="#1b1d23"/>
  <text x="24" y="34" fill="#e8eaf0" font-size="18" font-weight="bold">The reader: one row = what was on screen + one text box</text>
  <!-- row 1 -->
  <rect x="24" y="52" width="200" height="112" rx="4" fill="#2b3a55"/>
  <rect x="24" y="52" width="200" height="112" rx="4" fill="url(#g)"/>
  <path d="M70 164 v-60 a30 30 0 0 1 60 0 v60 z" fill="#6b5b95"/>
  <path d="M150 164 v-50 a25 25 0 0 1 50 0 v50 z" fill="#8a6d3b"/>
  <rect x="244" y="52" width="300" height="112" rx="6" fill="#111318" stroke="#3a3e49"/>
  <text x="258" y="80" fill="#f0c060" font-size="14">Name</text>
  <rect x="258" y="92" width="240" height="8" rx="4" fill="#4a4e5a"/>
  <rect x="258" y="110" width="200" height="8" rx="4" fill="#4a4e5a"/>
  <rect x="258" y="128" width="220" height="8" rx="4" fill="#4a4e5a"/>
  <text x="24" y="190" fill="#9aa0ad" font-size="13">Still pictures, no sound, no timing, no shakes. Scroll at your own pace.</text>
  <!-- chart -->
  <text x="580" y="68" fill="#e8eaf0" font-size="13" font-weight="bold">Story chart</text>
  <rect x="580" y="80" width="26" height="18" fill="#2a0000" stroke="#ffff00"/>
  <rect x="580" y="112" width="26" height="18" fill="#3a3e49"/>
  <rect x="640" y="112" width="26" height="18" fill="#3a3e49"/>
  <rect x="580" y="144" width="26" height="18" fill="#3a3e49"/>
  <rect x="640" y="144" width="26" height="18" fill="#3a3e49"/>
  <rect x="700" y="144" width="26" height="18" fill="#3a3e49"/>
  <path d="M593 98 V112 M593 130 V144 M606 121 H653 V144 M653 130 V144 M666 153 H713" stroke="#aab1c4" fill="none"/>
  <text x="580" y="190" fill="#9aa0ad" font-size="13">Unlocks like the game.</text>
  <text x="580" y="208" fill="#9aa0ad" font-size="13">Locked scenes stay hidden.</text>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3a55"/><stop offset="1" stop-color="#1a2233"/></linearGradient></defs>
</svg>
